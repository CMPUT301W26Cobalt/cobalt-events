fill="#000000" font-family="sans-serif" font-size="70" lengthAdjust="spacing" textLength="800.2832" x="30034.85" y="1134.8678">WaitlistEntrantAdapter</text><line style="stroke:#181818;stroke-width:2.5;" x1="29894.85" x2="30845.1332" y1="1190.6344" y2="1190.6344"/><line style="stroke:#181818;stroke-width:2.5;" x1="29894.85" x2="30845.1332" y1="1230.6344" y2="1230.6344"/></g><g class="entity" data-qualified-name="adapter.GMN102" data-source-line="376" id="ent0103"><path d="M28207.65,2210.8844 L28207.65,2336.5484 A0,0 0 0 0 28207.65,2336.5484 L30852.3473,2336.5484 A0,0 0 0 0 30852.3473,2336.5484 L30852.3473,2260.8844 L30802.3473,2210.8844 L30390,2210.8844 L30370,1272.9844 L30350,2210.8844 L28207.65,2210.8844 A0,0 0 0 0 28207.65,2210.8844" fill="#FEFFDD" style="stroke:#181818;stroke-width:2.5;"/><path d="M30802.3473,2210.8844 L30802.3473,2260.8844 L30852.3473,2260.8844 L30802.3473,2210.8844" fill="#FEFFDD" style="stroke:#181818;stroke-width:2.5;"/><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2539.6973" x="28237.65" y="2296.2188">Manage screen tabs; invited tab supports rescind invite (selected &#8594; pending).</text></g><!--class NotificationListAdapter--><g class="entity" data-qualified-name="adapter.NotificationListAdapter" data-source-line="378" id="ent0105"><rect fill="#F1F1F1" height="240" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:2.5;" width="962.9492" x="28753.55" y="1030.6344"/><ellipse cx="28828.55" cy="1110.6344" fill="#ADD1B2" rx="55" ry="55" style="stroke:#181818;stroke-width:5;"/><path d="M28843.3938,1138.8375 Q28840.5031,1140.3219 28837.3,1141.025 Q28834.0969,1141.8062 28830.5813,1141.8062 Q28818.0813,1141.8062 28811.4406,1133.6031 Q28804.8781,1125.3219 28804.8781,1109.6969 Q28804.8781,1094.0719 28811.4406,1085.7906 Q28818.0813,1077.5094 28830.5813,1077.5094 Q28834.0969,1077.5094 28837.3,1078.2906 Q28840.5813,1079.0719 28843.3938,1080.5562 L28843.3938,1094.15 Q28840.2688,1091.2594 28837.3,1089.9312 Q28834.3313,1088.525 28831.2063,1088.525 Q28824.4875,1088.525 28821.05,1093.9156 Q28817.6125,1099.2281 28817.6125,1109.6969 Q28817.6125,1120.1656 28821.05,1125.5562 Q28824.4875,1130.8687 28831.2063,1130.8687 Q28834.3313,1130.8687 28837.3,1129.5406 Q28840.2688,1128.1344 28843.3938,1125.2437 L28843.3938,1138.8375 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="70" lengthAdjust="spacing" textLength="802.9492" x="28898.55" y="1134.8678">NotificationListAdapter</text><line style="stroke:#181818;stroke-width:2.5;" x1="28758.55" x2="29711.4992" y1="1190.6344" y2="1190.6344"/><line style="stroke:#181818;stroke-width:2.5;" x1="28758.55" x2="29711.4992" y1="1230.6344" y2="1230.6344"/></g><g class="entity" data-qualified-name="N1" data-source-line="574" id="ent0281"><path d="M33781.85,9121.2844 L33781.85,9398.2766 A0,0 0 0 0 33781.85,9398.2766 L36298.1342,9398.2766 A0,0 0 0 0 36298.1342,9398.2766 L36298.1342,9171.2844 L36248.1342,9121.2844 L35060,9121.2844 L35040,8823.1844 L35020,9121.2844 L33781.85,9121.2844 A0,0 0 0 0 33781.85,9121.2844" fill="#FEFFDD" style="stroke:#181818;stroke-width:2.5;"/><path d="M36248.1342,9121.2844 L36248.1342,9171.2844 L36298.1342,9171.2844 L36248.1342,9121.2844" fill="#FEFFDD" style="stroke:#181818;stroke-width:2.5;"/><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2089.3311" x="33811.85" y="9206.6188">Models are plain Java objects aligned with Firestore serialization</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2107.4536" x="33811.85" y="9282.2829">(no-arg constructors, getters/setters). Controllers keep UI free of</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2411.2842" x="33811.85" y="9357.947">persistence details where possible; some screens use DB helpers directly.</text></g><g class="entity" data-qualified-name="N2" data-source-line="580" id="ent0282"><path d="M31599.55,5543.3344 L31599.55,5971.6547 L34170.4875,5971.6547 L34170.4875,5593.3344 L34120.4875,5543.3344 L31599.55,5543.3344" fill="#FEFFDD" style="stroke:#181818;stroke-width:2.5;"/><path d="M34120.4875,5543.3344 L34120.4875,5593.3344 L34170.4875,5593.3344 L34120.4875,5543.3344" fill="#FEFFDD" style="stroke:#181818;stroke-width:5;"/><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2308.4521" x="31629.55" y="5628.6688">Notification flow: waitlist changes write WaitingListDB / NotificationDB.</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2465.9375" x="31629.55" y="5704.3329">TYPE_EVENT_ALERT is used for organizer &#8220;notify current tab&#8221;, &#8220;notify entire</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2288.584" x="31629.55" y="5779.997">waitlist (all statuses)&#8221;, and admin event deletion alerts. Rescind invite</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2218.7598" x="31629.55" y="5855.661">deletes selection-style notifications for that entrant. recipient_mode</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="1205.9595" x="31629.55" y="5931.3251">distinguishes user vs organizer rows.</text></g><g class="entity" data-qualified-name="N3" data-source-line="591" id="ent0285"><path d="M55981,936.4844 L55981,1364.8047 L58678.9858,1364.8047 L58678.9858,986.4844 L58628.9858,936.4844 L55981,936.4844" fill="#FEFFDD" style="stroke:#181818;stroke-width:2.5;"/><path d="M58628.9858,936.4844 L58628.9858,986.4844 L58678.9858,986.4844 L58628.9858,936.4844" fill="#FEFFDD" style="stroke:#181818;stroke-width:5;"/><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2439.6265" x="56011" y="1021.8188">Account Settings: EntrantDB (local) + ProfileDB (remote); account deletion</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2342.2534" x="56011" y="1097.4829">runs organizer pass on events (cascade or co-org) then waitlist removal</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2518.4961" x="56011" y="1173.147">and profile delete. Admin dashboard row (same card as account mode) when</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2337.6196" x="56011" y="1248.811">device ID matches AdminConfig.ADMIN_DEVICE_ID. Save/delete require</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2592.9858" x="56011" y="1324.4751">NetworkConnectivity.hasValidatedInternet (same helper as browse/join/admin).</text></g><g class="entity" data-qualified-name="N5" data-source-line="601" id="ent0287"><path d="M64049.85,3856.7344 L64049.85,4133.7266 L67040.1137,4133.7266 L67040.1137,3906.7344 L66990.1137,3856.7344 L64049.85,3856.7344" fill="#FEFFDD" style="stroke:#181818;stroke-width:2.5;"/><path d="M66990.1137,3856.7344 L66990.1137,3906.7344 L67040.1137,3906.7344 L66990.1137,3856.7344" fill="#FEFFDD" style="stroke:#181818;stroke-width:5;"/><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2402.5244" x="64079.85" y="3942.0688">Client-side validated internet (util.NetworkConnectivity) before Firestore /</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2290.7739" x="64079.85" y="4017.7329">Storage actions: account settings, browse/join/QR, notifications, event</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2885.2637" x="64079.85" y="4093.397">create/manage/edit dialogs, comments binder, admin dashboard + comment drill-down.</text></g><g class="entity" data-qualified-name="N4" data-source-line="609" id="ent0289"><path d="M16820.1,2135.2344 L16820.1,2412.2266 L19799.8583,2412.2266 L19799.8583,2185.2344 L19749.8583,2135.2344 L16820.1,2135.2344" fill="#FEFFDD" style="stroke:#181818;stroke-width:2.5;"/><path d="M19749.8583,2135.2344 L19749.8583,2185.2344 L19799.8583,2185.2344 L19749.8583,2135.2344" fill="#FEFFDD" style="stroke:#181818;stroke-width:5;"/><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2874.7583" x="16850.1" y="2220.5688">Comments live under events/{eventId}/comments (+ replies). EventCommentsUiBinder</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2599.6191" x="16850.1" y="2296.2329">verifies event on server before writes on browse/QR cards; private events block</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="1571.9971" x="16850.1" y="2371.897">non-waitlisted users with the same rules as join.</text></g><!--link OrganizerController to GMN32--><g class="link" data-entity-1="ent0031" data-entity-2="ent0033" data-link-type="association" data-source-line="288" id="lnk34"><path d="M40530,2394.9844 C40530,2787.5344 40530,3998.2844 40530,3998.2844 C40530,3998.2844 41624.9,3998.2844 42474.9,3998.2844" fill="none" id="OrganizerController-GMN32" style="stroke:#181818;stroke-width:5;stroke-dasharray:35,35;"/></g><!--link EventDBConnector to EventDB--><g class="link" data-entity-1="ent0021" data-entity-2="ent0015" data-link-type="dependency" data-source-line="384" id="lnk106"><path codeLine="384" d="M58645.9,4199.1844 C58645.9,4663.2844 58645.9,5758.2844 58645.9,5758.2844 C58645.9,5758.2844 54712.25,5758.2844 52625.9,5758.2844" fill="none" id="EventDBConnector-to-EventDB" style="stroke:#181818;stroke-width:5;"/><polygon fill="#181818" points="52595.9,5758.2844,52640.9,5778.2844,52620.9,5758.2844,52640.9,5738.2844,52595.9,5758.2844" style="stroke:#181818;stroke-width:5;"/><text fill="#000000" font