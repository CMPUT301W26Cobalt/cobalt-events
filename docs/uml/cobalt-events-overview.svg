ze="70" lengthAdjust="spacing" textLength="800.2832" x="30034.85" y="1097.0678">WaitlistEntrantAdapter</text><line style="stroke:#181818;stroke-width:2.5;" x1="29894.85" x2="30845.1332" y1="1152.8344" y2="1152.8344"/><line style="stroke:#181818;stroke-width:2.5;" x1="29894.85" x2="30845.1332" y1="1192.8344" y2="1192.8344"/></g><g class="entity" data-qualified-name="adapter.GMN102" data-source-line="376" id="ent0103"><path d="M28207.65,2135.2344 L28207.65,2260.8984 A0,0 0 0 0 28207.65,2260.8984 L30852.3473,2260.8984 A0,0 0 0 0 30852.3473,2260.8984 L30852.3473,2185.2344 L30802.3473,2135.2344 L30390,2135.2344 L30370,1235.2344 L30350,2135.2344 L28207.65,2135.2344 A0,0 0 0 0 28207.65,2135.2344" fill="#FEFFDD" style="stroke:#181818;stroke-width:2.5;"/><path d="M30802.3473,2135.2344 L30802.3473,2185.2344 L30852.3473,2185.2344 L30802.3473,2135.2344" fill="#FEFFDD" style="stroke:#181818;stroke-width:2.5;"/><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2539.6973" x="28237.65" y="2220.5688">Manage screen tabs; invited tab supports rescind invite (selected &#8594; pending).</text></g><!--class NotificationListAdapter--><g class="entity" data-qualified-name="adapter.NotificationListAdapter" data-source-line="378" id="ent0105"><rect fill="#F1F1F1" height="240" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:2.5;" width="962.9492" x="28753.55" y="992.8344"/><ellipse cx="28828.55" cy="1072.8344" fill="#ADD1B2" rx="55" ry="55" style="stroke:#181818;stroke-width:5;"/><path d="M28843.3938,1101.0375 Q28840.5031,1102.5219 28837.3,1103.225 Q28834.0969,1104.0063 28830.5813,1104.0063 Q28818.0813,1104.0063 28811.4406,1095.8031 Q28804.8781,1087.5219 28804.8781,1071.8969 Q28804.8781,1056.2719 28811.4406,1047.9906 Q28818.0813,1039.7094 28830.5813,1039.7094 Q28834.0969,1039.7094 28837.3,1040.4906 Q28840.5813,1041.2719 28843.3938,1042.7563 L28843.3938,1056.35 Q28840.2688,1053.4594 28837.3,1052.1313 Q28834.3313,1050.725 28831.2063,1050.725 Q28824.4875,1050.725 28821.05,1056.1156 Q28817.6125,1061.4281 28817.6125,1071.8969 Q28817.6125,1082.3656 28821.05,1087.7563 Q28824.4875,1093.0688 28831.2063,1093.0688 Q28834.3313,1093.0688 28837.3,1091.7406 Q28840.2688,1090.3344 28843.3938,1087.4438 L28843.3938,1101.0375 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="70" lengthAdjust="spacing" textLength="802.9492" x="28898.55" y="1097.0678">NotificationListAdapter</text><line style="stroke:#181818;stroke-width:2.5;" x1="28758.55" x2="29711.4992" y1="1152.8344" y2="1152.8344"/><line style="stroke:#181818;stroke-width:2.5;" x1="28758.55" x2="29711.4992" y1="1192.8344" y2="1192.8344"/></g><g class="entity" data-qualified-name="N1" data-source-line="572" id="ent0279"><path d="M33781.85,9045.6344 L33781.85,9322.6266 A0,0 0 0 0 33781.85,9322.6266 L36298.1342,9322.6266 A0,0 0 0 0 36298.1342,9322.6266 L36298.1342,9095.6344 L36248.1342,9045.6344 L35060,9045.6344 L35040,8747.5344 L35020,9045.6344 L33781.85,9045.6344 A0,0 0 0 0 33781.85,9045.6344" fill="#FEFFDD" style="stroke:#181818;stroke-width:2.5;"/><path d="M36248.1342,9045.6344 L36248.1342,9095.6344 L36298.1342,9095.6344 L36248.1342,9045.6344" fill="#FEFFDD" style="stroke:#181818;stroke-width:2.5;"/><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2089.3311" x="33811.85" y="9130.9688">Models are plain Java objects aligned with Firestore serialization</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2107.4536" x="33811.85" y="9206.6329">(no-arg constructors, getters/setters). Controllers keep UI free of</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2411.2842" x="33811.85" y="9282.297">persistence details where possible; some screens use DB helpers directly.</text></g><g class="entity" data-qualified-name="N2" data-source-line="578" id="ent0280"><path d="M31599.55,5467.6844 L31599.55,5896.0047 L34170.4875,5896.0047 L34170.4875,5517.6844 L34120.4875,5467.6844 L31599.55,5467.6844" fill="#FEFFDD" style="stroke:#181818;stroke-width:2.5;"/><path d="M34120.4875,5467.6844 L34120.4875,5517.6844 L34170.4875,5517.6844 L34120.4875,5467.6844" fill="#FEFFDD" style="stroke:#181818;stroke-width:5;"/><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2308.4521" x="31629.55" y="5553.0188">Notification flow: waitlist changes write WaitingListDB / NotificationDB.</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2465.9375" x="31629.55" y="5628.6829">TYPE_EVENT_ALERT is used for organizer &#8220;notify current tab&#8221;, &#8220;notify entire</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2288.584" x="31629.55" y="5704.347">waitlist (all statuses)&#8221;, and admin event deletion alerts. Rescind invite</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2218.7598" x="31629.55" y="5780.011">deletes selection-style notifications for that entrant. recipient_mode</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="1205.9595" x="31629.55" y="5855.6751">distinguishes user vs organizer rows.</text></g><g class="entity" data-qualified-name="N3" data-source-line="589" id="ent0283"><path d="M55978.25,936.4844 L55978.25,1289.1406 L58601.7461,1289.1406 L58601.7461,986.4844 L58551.7461,936.4844 L55978.25,936.4844" fill="#FEFFDD" style="stroke:#181818;stroke-width:2.5;"/><path d="M58551.7461,936.4844 L58551.7461,986.4844 L58601.7461,986.4844 L58551.7461,936.4844" fill="#FEFFDD" style="stroke:#181818;stroke-width:5;"/><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2439.6265" x="56008.25" y="1021.8188">Account Settings: EntrantDB (local) + ProfileDB (remote); account deletion</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2342.2534" x="56008.25" y="1097.4829">runs organizer pass on events (cascade or co-org) then waitlist removal</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2518.4961" x="56008.25" y="1173.147">and profile delete. Admin dashboard row (same card as account mode) when</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="1676.1304" x="56008.25" y="1248.811">device ID matches AdminConfig.ADMIN_DEVICE_ID.</text></g><g class="entity" data-qualified-name="N4" data-source-line="598" id="ent0285"><path d="M16820.1,2059.5844 L16820.1,2336.5766 L19799.8583,2336.5766 L19799.8583,2109.5844 L19749.8583,2059.5844 L16820.1,2059.5844" fill="#FEFFDD" style="stroke:#181818;stroke-width:2.5;"/><path d="M19749.8583,2059.5844 L19749.8583,2109.5844 L19799.8583,2109.5844 L19749.8583,2059.5844" fill="#FEFFDD" style="stroke:#181818;stroke-width:5;"/><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2874.7583" x="16850.1" y="2144.9188">Comments live under events/{eventId}/comments (+ replies). EventCommentsUiBinder</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2599.6191" x="16850.1" y="2220.5829">verifies event on server before writes on browse/QR cards; private events block</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="1571.9971" x="16850.1" y="2296.247">non-waitlisted users with the same rules as join.</text></g><!--link OrganizerController to GMN32--><g class="link" data-entity-1="ent0031" data-entity-2="ent0033" data-link-type="association" data-source-line="288" id="lnk34"><path d="M40530,2319.3344 C40530,2711.8844 40530,3922.6344 40530,3922.6344 C40530,3922.6344 41624.9,3922.6344 42474.9,3922.6344" fill="none" id="OrganizerController-GMN32" st