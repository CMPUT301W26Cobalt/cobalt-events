75.0781,475.293 Q44876.9531,475.293 44878.125,476.6211 Q44879.2969,477.8711 44879.2969,480.918 L44879.2969,488.1836 Q44879.2969,491.2305 44878.125,492.5586 Q44876.9531,493.8867 44875.0781,493.8867 Q44873.3594,493.8867 44872.3438,492.8711 Q44871.3281,491.9336 44870.7813,489.3555 Q44870.5469,487.5586 44869.6094,486.6211 Q44867.9688,484.7461 44864.9219,483.6523 Q44861.875,482.5586 44858.75,482.5586 Q44854.9219,482.5586 44851.7188,484.1992 Q44848.5938,485.8398 44846.0938,489.5898 Q44843.6719,493.3398 44843.6719,498.4961 L44843.6719,503.9648 Q44843.6719,510.1367 44848.125,514.2773 Q44852.5781,518.3398 44860.5469,518.3398 Q44865.2344,518.3398 44868.5156,517.0898 Q44870.4688,516.3086 44872.5781,514.1211 Q44873.9063,512.793 44874.6094,512.4023 Q44875.3906,512.0117 44876.4063,512.0117 Q44878.0469,512.0117 44879.2969,513.3398 Q44880.625,514.5898 44880.625,516.3086 Q44880.625,518.0273 44878.9063,520.0586 Q44876.4063,522.9492 44872.4219,524.5898 Q44867.0313,526.8555 44860.5469,526.8555 Q44852.9688,526.8555 44846.9531,523.7305 Q44842.0313,521.2305 44838.5938,515.918 Q44835.1563,510.5273 44835.1563,504.1211 L44835.1563,498.3398 Q44835.1563,491.6992 44838.2031,485.9961 Q44841.3281,480.2148 44846.7969,477.168 Q44852.2656,474.043 44858.4375,474.043 Q44862.1094,474.043 44865.3125,474.9023 Q44868.5938,475.6836 44871.3281,477.4805 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="70" lengthAdjust="spacing" textLength="700.376" x="44927.5" y="527.0898">NotificationListAdapter</text><line style="stroke:#181818;stroke-width:2.5;" x1="44787.5" x2="45637.876" y1="578.1055" y2="578.1055"/><line style="stroke:#181818;stroke-width:2.5;" x1="44787.5" x2="45637.876" y1="618.1055" y2="618.1055"/></g><g class="entity" data-qualified-name="N1" data-source-line="371" id="ent0131"><path d="M36177.5,9888.1055 L36177.5,10197.4707 L38417.6611,10197.4707 L38417.6611,9938.1055 L38367.6611,9888.1055 L36177.5,9888.1055" fill="#FEFFDD" style="stroke:#181818;stroke-width:2.5;"/><path d="M38367.6611,9888.1055 L38367.6611,9938.1055 L38417.6611,9938.1055 L38367.6611,9888.1055" fill="#FEFFDD" style="stroke:#181818;stroke-width:5;"/><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="1853.4204" x="36207.5" y="9983.2471">Models are plain Java objects aligned with Firestore serialization</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="1845.9937" x="36207.5" y="10069.7021">(no-arg constructors, getters/setters). Controllers keep UI free of</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2135.1611" x="36207.5" y="10156.1572">persistence details where possible; some screens use DB helpers directly.</text></g><g class="entity" data-qualified-name="N2" data-source-line="377" id="ent0132"><path d="M16142.5,4318.1055 L16142.5,4627.4707 L18393.6108,4627.4707 L18393.6108,4368.1055 L18343.6108,4318.1055 L16142.5,4318.1055" fill="#FEFFDD" style="stroke:#181818;stroke-width:2.5;"/><path d="M18343.6108,4318.1055 L18343.6108,4368.1055 L18393.6108,4368.1055 L18343.6108,4318.1055" fill="#FEFFDD" style="stroke:#181818;stroke-width:5;"/><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2015.7617" x="16172.5" y="4413.2471">Notification flow: waitlist changes write WaitingListDB / NotificationDB.</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2098.9478" x="16172.5" y="4499.7021">TYPE_EVENT_ALERT is used for organizer &#8220;notify waitlisted&#8221; and admin</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2146.1108" x="16172.5" y="4586.1572">event deletion alerts. recipient_mode distinguishes user vs organizer rows.</text></g><g class="entity" data-qualified-name="N3" data-source-line="386" id="ent0135"><path d="M40005,2673.1055 L40005,3068.9258 L42328.4424,3068.9258 L42328.4424,2723.1055 L42278.4424,2673.1055 L40005,2673.1055" fill="#FEFFDD" style="stroke:#181818;stroke-width:2.5;"/><path d="M42278.4424,2673.1055 L42278.4424,2723.1055 L42328.4424,2723.1055 L42278.4424,2673.1055" fill="#FEFFDD" style="stroke:#181818;stroke-width:5;"/><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2140.5884" x="40035" y="2768.2471">Account Settings: EntrantDB (local) + ProfileDB (remote); account deletion</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2059.2749" x="40035" y="2854.7021">runs organizer pass on events (cascade or co-org) then waitlist removal</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2218.4424" x="40035" y="2941.1572">and profile delete. Admin dashboard row (same card as account mode) when</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="1549.7168" x="40035" y="3027.6123">device ID matches AdminConfig.ADMIN_DEVICE_ID.</text></g><g class="entity" data-qualified-name="N4" data-source-line="395" id="ent0137"><path d="M30,1583.1055 L30,1892.4707 L2625.9473,1892.4707 L2625.9473,1633.1055 L2575.9473,1583.1055 L30,1583.1055" fill="#FEFFDD" style="stroke:#181818;stroke-width:2.5;"/><path d="M2575.9473,1583.1055 L2575.9473,1633.1055 L2625.9473,1633.1055 L2575.9473,1583.1055" fill="#FEFFDD" style="stroke:#181818;stroke-width:5;"/><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2490.9473" x="60" y="1678.2471">Comments live under events/{eventId}/comments (+ replies). EventCommentsUiBinder</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2283.2202" x="60" y="1764.7021">verifies event on server before writes on browse/QR cards; private events block</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacin