2.5;"/><path d="M14307.6929,3033.0469 L14307.6929,3083.0469 L14357.6929,3083.0469 L14307.6929,3033.0469" fill="#FEFFDD" style="stroke:#181818;stroke-width:5;"/><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="1618.5571" x="12050" y="3125.5225">Notification flow is informational-only per latest changes:</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="1795.498" x="12050" y="3207.2803">- Waitlist status is updated in WaitingListDB by domain actions</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2149.7925" x="12050" y="3289.0381">- NotificationDB.updateReadStatus() toggles only the Notification.read field</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2232.6929" x="12050" y="3370.7959">- NotificationController listener opens NotificationsActivity (no event deep link)</text></g><g class="entity" data-qualified-name="N3" data-source-line="325" id="ent0105"><path d="M18650,1423.0469 L18650,1800.0781 L21251.5015,1800.0781 L21251.5015,1473.0469 L21201.5015,1423.0469 L18650,1423.0469" fill="#FEFFDD" style="stroke:#181818;stroke-width:2.5;"/><path d="M21201.5015,1423.0469 L21201.5015,1473.0469 L21251.5015,1473.0469 L21201.5015,1423.0469" fill="#FEFFDD" style="stroke:#181818;stroke-width:5;"/><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="671.9946" x="18680" y="1515.5225">Account Settings flows:</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="1779.248" x="18680" y="1597.2803">- Change account info: EntrantDB (local) + ProfileDB (remote)</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="2496.5015" x="18680" y="1679.0381">- Mute notifications: WaitingListDB.updateNotificationsAllowed(eventId, deviceId, false)</text><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="1448.7573" x="18680" y="1760.7959">- Delete account: ProfileDB.deleteProfile(deviceId)</text></g><!--link EventDBConnector to EventDB--><g class="link" data-entity-1="ent0015" data-entity-2="ent0010" data-link-type="dependency" data-source-line="253" id="lnk53"><path codeLine="253" d="M10913.75,3428.7469 C10913.75,3625.6469 10913.75,3895.9969 10913.75,4136.7469" fill="none" id="EventDBConnector-to-EventDB" style="stroke:#181818;stroke-width:5;"/><polygon fill="#181818" points="10913.75,4166.7469,10933.75,4121.7469,10913.75,4141.7469,10893.75,4121.7469,10913.75,4166.7469" style="stroke:#181818;stroke-width:5;"/><text fill="#000000" font-family="sans-serif" font-size="65" lengthAdjust="spacing" textLength="520.1904" x="10388.75" y="3780.2225">provides Firestore</text></g><!--link EventController to EventDB--><g class="link" data-entity-1="ent0018" data-entity-2="ent0010" data-link-type="dependency" data-source-line="254" id="lnk54"><path codeLine="254" d="M14387.5,1996.2969 C14387.5,2740.7969 14387.5,4303.0469 14387.5,4303.0469 C14387.5,4303.0469 12691.9,4303.0469 11518.2,4303.0469" fill="none" id="EventController-to-EventDB" style="stroke:#181818;stroke-width:5;"/><polygon fill="#181818" points="11488.2,4303.0469,11533.2,4323.0469,11513.2,4303.0469,11533.2,4283.0469,11488.2,4303.0469" style="stroke:#181818;stroke-width:5;"/></g><!--link EntrantController to EntrantDB--><g class="link" data-entity-1="ent0019" data-entity-2="ent0016" data-link-type="dependency" data-source-line="255" id="lnk55"><path codeLine="255" d="M4371.05,1818.0469 C3969.05,1818.0469 3482.5,1818.0469 3482.5,1818.0469 C3482.5,1818.0469 3482.5,2532.3969 3482.5,2936.5469" fill="none" id="EntrantController-to-EntrantDB" style="stroke:#181818;stroke-width:5;"/><polygon fill="#181818" points="3482.5,2966.5469,3502.5,2921.5469,3482.5,2941.5469,3462.5,2921.5469,3482.5,2966.5469" style="stroke:#181818;stroke-width:5;