buildscript {
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

plugins {
    id 'com.android.application' version '8.13.2' apply false
}

tasks.register('deployFirestoreIndexes', Exec) {
    group = 'firebase'
    description = 'Deploy Firestore indexes (firestore.indexes.json). Requires Firebase CLI in PATH.'
    commandLine 'firebase', 'deploy', '--only', 'firestore:indexes'
    workingDir rootProject.projectDir
}